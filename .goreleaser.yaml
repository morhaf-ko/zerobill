version: 2

builds:
  - main: ./cmd/zerobill
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - src: docs/*
        dst: docs
        strip_parent: true
      - src: examples/*
        dst: examples
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: false

dockers_v2:
  - images: ["ghcr.io/morhaf-ko/zerobill"]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.description: Conserves GitHub Actions hosted minutes.
