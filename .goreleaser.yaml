version: 2

builds:
  - main: ./cmd/zerobill
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, examples/config.yaml]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: false
