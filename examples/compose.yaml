# Run zerobill with Docker on a machine that stays on:
#   GITHUB_TOKEN=$(gh auth token) docker compose up -d
#   docker compose logs -f zerobill
# It only logs until you change the command to ["run", "--apply"].
services:
  zerobill:
    image: ghcr.io/morhaf-ko/zerobill:0.3.0
    restart: unless-stopped
    command: ["run"]
    environment: [GITHUB_TOKEN]
    volumes:
      - ~/.config/zerobill/config.yaml:/etc/zerobill/config.yaml:ro
      - state:/var/lib/zerobill
volumes:
  state:
