# Published image; test an unreleased candidate with a local image override.
# See docs/service.md. Settings come from .env beside this file, not the CLI's YAML config.
services:
  zerobill:
    image: ghcr.io/morhaf-ko/zerobill:latest
    restart: unless-stopped
    command: ["run"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      ZEROBILL_OWNER: ${ZEROBILL_OWNER:?set ZEROBILL_OWNER in .env}
      ZEROBILL_SELF_HOSTED_LABEL: ${ZEROBILL_SELF_HOSTED_LABEL:-}
      ZEROBILL_BLACKSMITH: ${ZEROBILL_BLACKSMITH:-false}
      ZEROBILL_RESERVE_PERCENT: ${ZEROBILL_RESERVE_PERCENT:-10}
      ZEROBILL_ALERT_REMAINING_PERCENT: ${ZEROBILL_ALERT_REMAINING_PERCENT:-20}
      ZEROBILL_CHECK_INTERVAL: ${ZEROBILL_CHECK_INTERVAL:-5m}
      ZEROBILL_QUEUE_TIMEOUT: ${ZEROBILL_QUEUE_TIMEOUT:-10m}
      ZEROBILL_NOTIFY: ${ZEROBILL_NOTIFY:-}
    volumes:
      - state:/var/lib/zerobill
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  state:
