# Run zerobill with Docker Compose on any always-on machine:
#   1. Put your config next to this file as zerobill.yaml (see zerobill.yaml in this folder).
#   2. Put GITHUB_TOKEN=... in zerobill.env, readable only by you (chmod 600).
#   3. docker compose up -d; follow decisions with docker compose logs -f zerobill.
# Take a provider out of rotation, for example while you travel:
#   docker compose exec zerobill zerobill disable home --for 72h
#   docker compose exec zerobill zerobill enable home
services:
  zerobill:
    image: ghcr.io/morhaf-ko/zerobill:0.2.0
    restart: unless-stopped
    env_file: zerobill.env
    volumes:
      - state:/var/lib/zerobill
      - ./zerobill.yaml:/var/lib/zerobill/zerobill.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  state:
